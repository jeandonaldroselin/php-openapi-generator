php_openapi_generator:
    # Path to the JSON file describing the client(s) to generate.
    # Supports the %kernel.project_dir% placeholder.
    config_path: '%kernel.project_dir%/openapi-generator.json'

    # Where openapi-generator-cli.jar files are cached between runs.
    cache_dir: 'var/openapi-generator/cache'

    # Where generated client code is written. Not installed into vendor/ - add this directory
    # to your project's .gitignore.
    generated_dir: '.generated'

    # Binary used to run the generator jar.
    java_binary: 'java'

    # Used when a client entry does not set its own openapi_generator_version.
    default_generator_version: '7.9.0'
